# V1-04 delivery orchestration: db / init / api / web (Spec §5.1).
#
# One command from an empty Docker state to an operable workbench:
#
#   docker-compose -f project/docker-compose.yml -p v104cs up --build -d
#
# The project name defaults to `v104cs` so every container, volume and network carries
# that prefix; a checkout that must not touch existing Docker state can pass `-p` with
# another `v104cs`-prefixed name.  Only loopback ports are published; the database is
# reachable only from the orchestration network.
#
# Secrets never appear in this file, in an image layer or in a log line: the database
# superuser password is generated inside the `db` container, the three role passwords are
# generated by `init`, and both live in named volumes (see scripts/init_bootstrap.py).

name: v104cs

services:

  db:
    image: pgvector/pgvector:pg17@sha256:cf134a767f474095eeba57e0117be8e568e011a63f33fbf252f14c9b760f8e6f
    # Bind-mounted wrapper: it generates the superuser password once per secrets volume
    # and then delegates to the untouched upstream entrypoint.
    entrypoint: ["/usr/local/bin/v104cs-db-entrypoint.sh"]
    command: ["postgres"]
    environment:
      POSTGRES_DB: review_workbench
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/v104cs/bootstrap/postgres_password
      V104CS_BOOTSTRAP_DIR: /run/v104cs/bootstrap
    volumes:
      - db-data:/var/lib/postgresql/data
      - bootstrap-secrets:/run/v104cs/bootstrap
      - ./scripts/db_entrypoint.sh:/usr/local/bin/v104cs-db-entrypoint.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks: [workbench]

  # One-shot bootstrap.  This is the only container that ever holds the PostgreSQL
  # superuser credential; the api runtime role is created here (Spec §5.3, closes L-1).
  init:
    # The API build produces the shared image once before containers start.
    # A second build with the same tag can race during parallel Compose builds.
    image: v104cs-backend:local
    pull_policy: never
    user: "0:0"
    restart: "no"
    command: ["python", "/app/scripts/init_bootstrap.py"]
    environment:
      V104CS_DB_HOST: db
      V104CS_DB_PORT: "5432"
      V104CS_DB_NAME: review_workbench
      V104CS_SUPERUSER: postgres
      V104CS_BOOTSTRAP_DIR: /run/v104cs/bootstrap
      V104CS_RUNTIME_DIR: /run/v104cs/runtime
      V104CS_CREDENTIAL_DIR: /run/v104cs/delivery/credentials
      V104CS_RUNTIME_UID: "10001"
      V104CS_RUNTIME_GID: "10001"
      V104CS_DEMO_SUBJECT: subject-local-demo
      V104CS_CREDENTIAL_TTL_SECONDS: "2592000"
    volumes:
      - bootstrap-secrets:/run/v104cs/bootstrap
      - runtime-secrets:/run/v104cs/runtime
      # Protected host path for the demo credential: Git-ignored, 0700 directory and
      # 0600 file, created by the tool itself.
      - ./.local/delivery:/run/v104cs/delivery
    depends_on:
      db:
        condition: service_healthy
    networks: [workbench]

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: v104cs-backend:local
    environment:
      # The browser origin is the published frontend port; it must be the only allowed
      # origin and it follows `V104CS_WEB_PORT` when the default port is taken.
      REVIEW_ALLOWED_ORIGINS: http://127.0.0.1:${V104CS_WEB_PORT:-5173},http://localhost:${V104CS_WEB_PORT:-5173}
      # Diagnostic surface only (V1-06 AC-08): the level is operator-tunable and no
      # business contract depends on it.
      REVIEW_LOG_LEVEL: ${REVIEW_LOG_LEVEL:-INFO}
      V104CS_RUNTIME_DSN_FILE: /run/v104cs/runtime/runtime_dsn
      V104CS_EXPECTED_ROLE: review_runtime
    volumes:
      # Read-only: the API may read its own least-privilege DSN, never rewrite it, and
      # the migrator credential lives in a different volume that is not mounted here.
      - runtime-secrets:/run/v104cs/runtime:ro
    ports:
      # Loopback only.  The host port is overridable so the one-key start survives a
      # machine where 8000 is already taken; the delivered default stays 8000.
      - "127.0.0.1:${V104CS_API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "/app/scripts/api_healthcheck.py"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    depends_on:
      db:
        condition: service_healthy
      init:
        condition: service_completed_successfully
    networks: [workbench]

  web:
    build:
      context: frontend
      dockerfile: Dockerfile
    image: v104cs-frontend:local
    environment:
      # Same-origin `/api` proxy target inside the orchestration network.
      REVIEW_API_ORIGIN: http://api:8000
    ports:
      # Loopback only; the delivered default stays 5173.
      - "127.0.0.1:${V104CS_WEB_PORT:-5173}:5173"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:5173/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    depends_on:
      api:
        condition: service_healthy
    networks: [workbench]

volumes:
  db-data:
  bootstrap-secrets:
  runtime-secrets:

networks:
  workbench:
    driver: bridge
