title = "Public source scan: reviewed checksums and synthetic fixtures only"

[extend]
useDefault = true

[[allowlists]]
description = "Reviewed synthetic fixture or public metric identifier; exact value and file only"
condition = "AND"
targetRules = ["generic-api-key"]
regexTarget = "secret"
regexes = [ '''^aud2\-05\-foreign$''' ]
paths = [
  '''(?:^|/)\.gitleaks\.toml$''',
  '''(?:^|/)project/backend/tests/test_fix01b_record_export\.py$''',
]

